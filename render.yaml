services:
  - type: web
    name: civilicapulse-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CIVILICA_ALLOWED_ORIGINS
        value: https://soheil-aghayani.github.io,http://127.0.0.1:5000,http://localhost:5000
