<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">CivilicaPulse</title>
  <desc id="desc">A Persian academic research tool to extract and format Civilica publications into Word documents.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d"/>
      <stop offset="50%" stop-color="#111f38"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="30%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b3b55" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#16233b" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="24" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="24" fill="url(#blueGlow)"/>
  <rect width="1200" height="360" rx="24" fill="url(#goldGlow)"/>

  <!-- Border Highlight -->
  <rect width="1198" height="358" x="1" y="1" rx="23" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Decorative Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Pulse Waveform Graphic in Background -->
  <path d="M 680 180 L 740 180 L 760 140 L 780 220 L 800 130 L 820 230 L 840 170 L 860 180 L 920 180" 
        fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
  <circle cx="800" cy="130" r="4" fill="#38bdf8" opacity="0.8"/>
  <circle cx="820" cy="230" r="4" fill="#f59e0b" opacity="0.8"/>

  <!-- Right Visual Elements: Stacked Academic Document Cards -->
  <!-- Card 1 (Back angled) -->
  <g transform="matrix(0.97, 0.12, -0.12, 0.97, 950, 48)" filter="url(#cardShadow)">
    <rect width="200" height="250" rx="14" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5"/>
    <rect x="20" y="24" width="70" height="8" rx="4" fill="#475569"/>
    <rect x="20" y="44" width="160" height="10" rx="4" fill="#64748b"/>
    <rect x="20" y="62" width="130" height="10" rx="4" fill="#64748b"/>
    <rect x="20" y="90" width="160" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="104" width="150" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="118" width="140" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="132" width="110" height="6" rx="3" fill="#334155"/>
  </g>

  <!-- Card 2 (Front floating main card) -->
  <g transform="matrix(0.99, -0.04, 0.04, 0.99, 875, 52)" filter="url(#cardShadow)">
    <rect width="220" height="265" rx="16" fill="url(#cardGrad2)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.8"/>
    
    <!-- Header Badge -->
    <rect x="22" y="22" width="86" height="22" rx="11" fill="#1e3a5f" stroke="#2563eb" stroke-width="1"/>
    <text x="35" y="37" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#38bdf8">مقاله ژورنالی</text>

    <!-- Year badge -->
    <rect x="145" y="22" width="52" height="22" rx="11" fill="#2d2215" stroke="#f59e0b" stroke-width="1"/>
    <text x="157" y="37" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="11" font-weight="700" fill="#fbbf24">۱۴۰۳</text>

    <!-- Article title lines -->
    <rect x="22" y="60" width="176" height="12" rx="6" fill="#f8fafc"/>
    <rect x="22" y="80" width="130" height="12" rx="6" fill="#f8fafc"/>

    <!-- Metadata lines -->
    <rect x="22" y="110" width="176" height="7" rx="3.5" fill="#94a3b8" opacity="0.8"/>
    <rect x="22" y="124" width="150" height="7" rx="3.5" fill="#94a3b8" opacity="0.8"/>
    <rect x="22" y="138" width="162" height="7" rx="3.5" fill="#94a3b8" opacity="0.8"/>

    <!-- Citation Style Pill -->
    <rect x="22" y="170" width="176" height="38" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="34" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="600" fill="#f59e0b">APA 7th Reference</text>

    <!-- Word Export Pill -->
    <rect x="22" y="218" width="176" height="30" rx="7" fill="url(#blueAccent)"/>
    <text x="56" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="700" fill="#ffffff">EXPORT .DOCX</text>
  </g>

  <!-- Left Content: Branding, Badges & Typography -->
  <!-- Category Tag -->
  <g transform="translate(80, 56)">
    <rect width="258" height="28" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="15" cy="14" r="4" fill="#f59e0b"/>
    <text x="27" y="19" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="11" font-weight="800" fill="#fcd34d" letter-spacing="1.5">PERSIAN RESEARCH ENGINE</text>
  </g>

  <!-- Title -->
  <g transform="translate(80, 134)">
    <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      CIVILICA<tspan fill="url(#blueAccent)">PULSE</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <g transform="translate(80, 172)">
    <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#cbd5e1">
      Extract, Curate, and Format Civilica Publications to Word
    </text>
  </g>

  <!-- Feature Checklist -->
  <g transform="translate(80, 222)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    <g transform="translate(0, 0)">
      <circle cx="6" cy="6" r="3" fill="#38bdf8"/>
      <text x="18" y="10">Multi-Style Citations: APA 7th · Vancouver · IEEE · Harvard · Chicago · MLA · BibTeX</text>
    </g>
    <g transform="translate(0, 24)">
      <circle cx="6" cy="6" r="3" fill="#f59e0b"/>
      <text x="18" y="10">Standard .docx &amp; Legacy .doc Word Generation with RTL Persian Typography</text>
    </g>
  </g>

  <!-- CTA Action Badge / Button -->
  <g transform="translate(80, 286)">
    <rect width="180" height="38" rx="19" fill="url(#goldAccent)"/>
    <text x="26" y="24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="1">LAUNCH APP →</text>
  </g>

  <g transform="translate(275, 286)">
    <rect width="165" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="22" y="24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">VIEW ON GITHUB</text>
  </g>
</svg>
